<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Account Login — Turqs Maldives</title>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="logo" href="index.html">TURQS <span>MALDIVES </span></a>
    <h2 style="margin-top:18px">Backend Login</h2>
    <p class="subtitle">Sign in to manage orders, stock and customers.</p>

    <form id="loginForm" novalidate>
      <div class="alert"></div>
      <div class="field"><label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="staff@turqs.com"></div>
      <div class="field"><label for="password">Password</label>
        <div style="display:flex;gap:8px">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="********">
          <button type="button" class="btn ghost" data-toggle-pass style="padding:10px 14px">Show</button>
        </div></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);margin:10px 0 18px">
        <input type="checkbox" name="remember" style="width:auto"> Remember my email
      </label>
      <button class="btn block" type="submit">Sign in</button>
    </form>

    <p class="auth-note">
      Demo staff account — <strong>staff@turqs.com / Staff@123</strong><br>
      Administrator? <a href="admin.html" style="color:var(--gold)">Go to the admin panel</a>
    </p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>initLoginForm('loginForm', null, 'admin-dashboard.html');</script>
</body>
</html>
