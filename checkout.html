        <div class="field"><label for="shipMethod">Delivery method</label>
          <select id="shipMethod">
            <option value="standard">Standard insured — 3-5 business days (free over $500)</option>
            <option value="express">Express insured — 1-2 business days (+$25)</option>
            <option value="pickup">Boutique pickup — ready in 24 h (free)</option>
          </select></div>
        <div class="field"><label for="notes">Delivery notes / gift message</label>
          <textarea id="notes" rows="3" placeholder="e.g. leave with concierge"></textarea></div>
      </section>

      <section class="panel">
        <h3>Payment Method</h3>
        <label class="pay-option selected" data-method="card">
          <input type="radio" name="pay" value="card" checked>
          <span><strong>Credit / Debit Card</strong><br>
            <small class="hint">Visa, Mastercard, Amex — secured by Stripe</small></span>
        </label>
        <label class="pay-option" data-method="upi">
          <input type="radio" name="pay" value="upi">
          <span><strong>UPI / Net Banking</strong><br><small class="hint">Razorpay hosted checkout</small></span>
        </label>
        <label class="pay-option" data-method="paypal">
          <input type="radio" name="pay" value="paypal">
          <span><strong>PayPal</strong><br><small class="hint">You will be redirected to PayPal</small></span>
        </label>
        <label class="pay-option" data-method="cod">
          <input type="radio" name="pay" value="cod">
          <span><strong>Cash on Delivery</strong><br><small class="hint">Available on orders under $1,000</small></span>
        </label>

        <div id="cardFields" style="margin-top:18px">
          <div class="field"><label for="cardName">Name on card *</label>
            <input id="cardName" autocomplete="cc-name"><span class="error"></span></div>
          <div class="field"><label for="cardNumber">Card number *</label>
            <input id="cardNumber" inputmode="numeric" placeholder="4242 4242 4242 4242" autocomplete="cc-number"><span class="error"></span></div>
          <div class="form-row">
            <div class="field"><label for="cardExpiry">Expiry (MM/YY) *</label>
              <input id="cardExpiry" placeholder="09/28" autocomplete="cc-exp"><span class="error"></span></div>
            <div class="field"><label for="cardCvv">CVV *</label>
              <input id="cardCvv" inputmode="numeric" placeholder="123" autocomplete="cc-csc"><span class="error"></span></div>
          </div>
          <p class="auth-note">Card data is tokenised by the gateway; it never touches our servers.</p>
        </div>
      </section>

    <aside class="panel">
      <h3>Order Summary</h3>

      <div class="summary-row" style="border-top:1px solid var(--border);margin-top:8px;padding-top:12px">
        <span>Subtotal</span><span id="coSub"></span></div>
      <div class="summary-row"><span>Delivery</span><span id="coShip"></span></div>
      <div class="summary-row"><span>Tax</span><span id="coTax"></span></div>
      <div class="summary-row total"><span>Total</span><span id="coTotal"></span></div>
      <button class="btn block" id="payBtn" type="submit" style="margin-top:18px">Pay</button>
