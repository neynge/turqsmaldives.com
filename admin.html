<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login — Turqs Maldives</title>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <span class="tag pending">Restricted area</span>
    <h2 style="margin-top:14px">Administrator Sign-in</h2>
    <p class="subtitle">Authorised personnel only. All catalogue changes are logged.</p>

    <form id="adminForm" novalidate>
      <div class="alert"></div>
      <div class="field"><label for="email">Admin email</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="youremail@turqsmaldives.com"></div>
      <div class="field"><label for="password">Password</label>
        <div style="display:flex;gap:8px">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="********">
          <button type="button" class="btn ghost" data-toggle-pass style="padding:10px 14px">Show</button>
        </div></div>
      <div class="field"><label for="otp">2FA code (optional)</label>
        <input id="otp" inputmode="numeric" placeholder="6-digit code"></div>
      <button class="btn block" type="submit">Sign in</button>
    </form>

    <p class="auth-note">
      <a href="index.html" style="color:var(--gold)">Return to store</a>
    </p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>initLoginForm('adminForm', 'admin', 'admin-dashboard.html');</script>
</body>
</html>
